<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Fridaous Yusuph</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="loginTitle">
            <p class="eyebrow">Fridaous Yusuph</p>
            <h1 id="loginTitle">Welcome back</h1>
            <p id="loginIntro">Log in to continue to the site.</p>

            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" name="email" type="email" autocomplete="email" required>
                <label for="loginPassword">Password</label>
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                <label class="auth-remember" for="rememberMe">
                    <input id="rememberMe" name="rememberMe" type="checkbox">
                    Remember me
                </label>
                <button class="auth-submit" type="submit">Enter website</button>
                <p class="auth-switch">
                    New here?
                    <a href="/auth.html">Create an account</a>
                </p>
            </form>

            <p class="auth-message" id="authMessage" role="alert" hidden></p>
        </section>
    </main>
    <script src="login.js"></script>
</body>
</html>
